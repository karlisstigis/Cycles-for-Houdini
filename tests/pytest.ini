[pytest]
testpaths = pytest_cases
python_files = test_*.py
addopts = --strict-markers --strict-config -ra -p no:cacheprovider
markers =
    pure: host-independent contracts runnable with ordinary Python
    cpu: CPU renderer or pure contract
    optix: requires an NVIDIA OptiX device
    gui: requires a Houdini graphical session
    slow: long-running integration or rendering check
    blender: requires a Blender evaluator
    release_gate: required release acceptance check
    hython: requires a verified Houdini native runtime
